name: Simulação em laboratório (Containerlab)

# Suíte rápida a cada push; suíte completa todo dia às 06:00 (Brasília), sob demanda (Run workflow)
# ou num push cuja mensagem de commit contenha "[lab completa]".
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suíte de cenários"
        type: choice
        options: [completa, rapida]
        default: completa
  schedule:
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "src/**"
      - ".github/workflows/lab-simulation.yml"

permissions:
  contents: read

concurrency:
  group: lab-simulation-${{ github.event_name == 'push' && 'push' || 'completa' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CLAB_VERSION: "0.79.0"
  VRNETLAB_VERSION: "v0.21.0"
  CHR_VERSION: "7.16.2"
  PYTHONUNBUFFERED: "1"
  LOGS: lab-results/logs
  SUITE: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[lab completa]')
    && 'rapida' || inputs.suite || 'completa' }}
  IMAGE_CACHE: /tmp/image-cache

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # publica os resultados no branch lab-results
    defaults:
      run:
        shell: bash # bash -eo pipefail: falhas não ficam escondidas pelo "| tee"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Recursos do runner
        run: |
          mkdir -p "$LOGS"
          { echo "suíte: $SUITE"; nproc; free -h; df -h /; ls -l /dev/kvm || true; uname -a; } 2>&1 | tee "$LOGS/00-runner.log"

      - name: Habilitar KVM (VMs MikroTik CHR)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee "$LOGS/01-kvm.log"

      - name: Instalar containerlab
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)" -- -v "${CLAB_VERSION}" 2>&1 | tail -20 | tee "$LOGS/02-containerlab.log"
          containerlab version | tee -a "$LOGS/02-containerlab.log"

      # A imagem do CHR (vrnetlab + disco do RouterOS) só muda com as versões: fica em cache.
      - name: Cache da imagem MikroTik CHR
        id: chr-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.IMAGE_CACHE }}/chr.tar.zst
          key: chr-${{ env.CHR_VERSION }}-vrnetlab-${{ env.VRNETLAB_VERSION }}

      - name: Carregar imagem MikroTik CHR do cache
        if: steps.chr-cache.outputs.cache-hit == 'true'
        run: |
          zstd -dc "$IMAGE_CACHE/chr.tar.zst" | docker load 2>&1 | tee "$LOGS/03-build-chr.log"
          docker image inspect nettopo/chr:lab > /dev/null

      - name: Construir imagem MikroTik CHR (vrnetlab)
        if: steps.chr-cache.outputs.cache-hit != 'true'
        run: |
          {
            git clone --depth 1 --branch "${VRNETLAB_VERSION}" https://github.com/srl-labs/vrnetlab /tmp/vrnetlab
            cd /tmp/vrnetlab/routeros
            for host in download.mikrotik.com cdn.mikrotik.com download2.mikrotik.com; do
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o chr.zip                 "https://${host}/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.vmdk.zip" && break
              echo "falha ao baixar de ${host}, tentando o próximo"
            done
            test -s chr.zip
            unzip -o chr.zip && rm chr.zip
            make docker-image
          } 2>&1 | tee "$GITHUB_WORKSPACE/$LOGS/03-build-chr.log"
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i routeros | head -1)
          echo "imagem gerada: $IMG" | tee -a "$LOGS/03-build-chr.log"
          docker tag "$IMG" nettopo/chr:lab
          mkdir -p "$IMAGE_CACHE"
          docker save nettopo/chr:lab | zstd -T0 -3 -o "$IMAGE_CACHE/chr.tar.zst"
          ls -lh "$IMAGE_CACHE" | tee -a "$LOGS/03-build-chr.log"

      # Salva já aqui (e não no fim do job): um cenário reprovado não pode impedir o cache.
      - name: Guardar imagem MikroTik CHR no cache
        if: steps.chr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.IMAGE_CACHE }}/chr.tar.zst
          key: ${{ steps.chr-cache.outputs.cache-primary-key }}

      - name: Construir imagem Linux (FRR + lldpd + SNMP + SSH)
        run: docker build -t nettopo/linux-net:lab lab/images/linux-net 2>&1 | tee "$LOGS/04-build-linux.log"

      # O Mapa de Rede é instalado enquanto o laboratório sobe (as VMs levam ~1 min para iniciar).
      - name: Subir o laboratório e instalar o Mapa de Rede
        run: |
          EXTRA=""
          if [ "$SUITE" = "completa" ]; then EXTRA="pytest-cov mypy bandit types-PyYAML"; fi
          ( pip install -e ".[dev]" $EXTRA > "$LOGS/06-install.log" 2>&1; echo $? > /tmp/pip.rc ) &
          sudo containerlab deploy -t lab/nettopo-lab.clab.yml --reconfigure 2>&1 | tee "$LOGS/05-deploy.log"
          wait
          tail -5 "$LOGS/06-install.log"
          test "$(cat /tmp/pip.rc)" = 0

      - name: Aguardar e configurar equipamentos
        working-directory: lab/scripts
        run: python configure.py "$GITHUB_WORKSPACE/lab-results" 2>&1 | tee "$GITHUB_WORKSPACE/$LOGS/07-configure.log"

      - name: Saídas brutas e matriz de parsing
        working-directory: lab/scripts
        run: python dump_raw.py "$GITHUB_WORKSPACE/lab-results" 2>&1 | tee "$GITHUB_WORKSPACE/$LOGS/08-dump-raw.log"

      - name: Cenários da simulação
        working-directory: lab/scripts
        run: python run_scenarios.py "$GITHUB_WORKSPACE/lab-results" "$SUITE" 2>&1 | tee "$GITHUB_WORKSPACE/$LOGS/09-scenarios.log"

      # Critério de aceite: o job falha se qualquer cenário tiver um erro em relação ao gabarito.
      - name: Erros em relação ao gabarito
        id: score
        if: always()
        working-directory: lab/scripts
        run: python score.py "$GITHUB_WORKSPACE/lab-results" --strict 2>&1 | tee "$GITHUB_WORKSPACE/$LOGS/10-score.log"

      # Testes e lint rodam no ci.yml a cada push; aqui só na suíte completa, para os relatórios.
      - name: Qualidade de código
        if: always() && env.SUITE == 'completa'
        run: |
          mkdir -p lab-results/quality
          pytest -q --cov=nettopo --cov-report=term --cov-report=json:lab-results/quality/coverage.json \
            > lab-results/quality/pytest.txt 2>&1 || true
          ruff check src tests lab > lab-results/quality/ruff.txt 2>&1 || true
          mypy src/nettopo --ignore-missing-imports > lab-results/quality/mypy.txt 2>&1 || true
          bandit -r src/nettopo -f json -o lab-results/quality/bandit.json > /dev/null 2>&1 || true
          tail -3 lab-results/quality/pytest.txt; tail -1 lab-results/quality/mypy.txt

      - name: Estado final do laboratório
        if: always()
        run: |
          sudo containerlab inspect -t lab/nettopo-lab.clab.yml > "$LOGS/11-inspect.log" 2>&1 || true
          for c in $(docker ps -a --format '{{.Names}}' | grep clab-nettopo); do
            docker logs "$c" > "$LOGS/container-$c.log" 2>&1 || true
          done
          cat lab-results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "sem resumo" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-results
          path: lab-results/
          retention-days: 30

      - name: Publicar resultados (branch lab-results)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          DEST=/tmp/results-branch
          if ! git clone -q --depth 1 --branch lab-results "$REMOTE" "$DEST" 2>/dev/null; then
            mkdir -p "$DEST" && cd "$DEST" && git init -q -b lab-results && git remote add origin "$REMOTE" && cd -
          fi
          RUN_DIR="runs/${RUN_ID}-${RUN_ATTEMPT}"
          mkdir -p "$DEST/$RUN_DIR"
          cp -r lab-results/. "$DEST/$RUN_DIR/"
          echo "{\"run_id\": \"${RUN_ID}\", \"attempt\": \"${RUN_ATTEMPT}\", \"sha\": \"${GITHUB_SHA}\", \"suite\": \"${SUITE}\", \"dir\": \"${RUN_DIR}\"}" > "$DEST/latest.json"
          cd "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Resultados da simulação ($SUITE): run ${RUN_ID} (${GITHUB_SHA::7})"
          git push -q origin lab-results

      - name: Destruir o laboratório
        if: always()
        run: sudo containerlab destroy -t lab/nettopo-lab.clab.yml --cleanup || true
