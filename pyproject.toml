[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nettopo"
version = "0.1.0"
description = "Descoberta automática de topologia de rede multi-vendor com geração de diagramas e documentação"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "netmiko>=4.3",
    "ntc-templates>=4.0",
    "textfsm>=1.1",
    "pysnmp>=7.1",
    "ncclient>=0.6.15",
    "httpx>=0.27",
    "pydantic>=2.6",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "snmpsim>=1.1", "pysmi>=1.5"]

[project.scripts]
nettopo = "nettopo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nettopo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
