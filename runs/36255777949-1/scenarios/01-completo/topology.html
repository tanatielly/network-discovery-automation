<style>
/* NetTopo - estilos do visualizador (relatório HTML e UI web) */
:root {
  --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eef1f4; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
  --accent: #0969da; --accent-fg: #ffffff; --edge: #8c959f; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
  --shadow: 0 1px 3px rgba(31,35,40,.12), 0 8px 24px rgba(66,74,83,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d;
    --accent: #4493f8; --edge: #6e7681; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d;
  --accent: #4493f8; --edge: #6e7681; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  --shadow: 0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); }
.nt-muted { color: var(--muted); }
.nt-mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }

.nt-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: 18px 20px 10px; border-bottom: 1px solid var(--border); background: var(--bg); }
.nt-head h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.nt-head .nt-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.nt-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.nt-stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-width: 88px; }
.nt-stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.nt-stat span { color: var(--muted); font-size: 11.5px; }
.nt-stat.err b { color: var(--err); }

.nt-tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--bg);
  overflow-x: auto; position: sticky; top: 0; z-index: 5; }
.nt-tab { appearance: none; border: 0; background: none; color: var(--muted); padding: 10px 12px; font: inherit;
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.nt-tab:hover { color: var(--fg); }
.nt-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.nt-tab .nt-count { background: var(--bg3); border-radius: 10px; padding: 0 7px; font-size: 11.5px; margin-left: 4px; }
.nt-panel { padding: 16px 20px 28px; }
.nt-panel[hidden] { display: none; }

.nt-diagram { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; height: calc(100vh - 190px);
  min-height: 460px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg); }
.nt-diagram.nodetail { grid-template-columns: minmax(0, 1fr) 0; }
.nt-canvas-wrap { position: relative; min-width: 0; }
.nt-canvas { position: absolute; inset: 0; }
.nt-toolbar { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px;
  align-items: center; pointer-events: none; }
.nt-toolbar > * { pointer-events: auto; }
.nt-input, .nt-select, .nt-btn { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; }
.nt-input:focus, .nt-select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.nt-btn { cursor: pointer; background: var(--bg2); }
.nt-btn:hover { background: var(--bg3); }
.nt-btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.nt-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; user-select: none; }
.nt-legend { position: absolute; left: 10px; bottom: 10px; z-index: 3; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 11.5px; box-shadow: var(--shadow); max-width: calc(100% - 20px); }
.nt-legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.nt-legend .it { display: inline-flex; align-items: center; gap: 5px; }
.nt-legend img { width: 16px; height: 16px; }
.nt-legend .ln { display: inline-block; width: 22px; border-top: 3px solid var(--edge); vertical-align: middle; }
.nt-legend .ln.l3 { border-top: 3px dashed #0969da; }
.nt-legend .ln.logical { border-top: 3px dotted #bf8700; }

.nt-detail { border-left: 1px solid var(--border); overflow: auto; background: var(--bg2); padding: 14px; }
.nt-detail h2 { font-size: 16px; margin: 0 0 2px; word-break: break-all; }
.nt-detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.nt-badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--bg3);
  border: 1px solid var(--border); margin: 2px 4px 2px 0; }
.nt-badge.stub { border-style: dashed; }
.nt-badge.ok { color: var(--ok); } .nt-badge.err { color: var(--err); }
.nt-kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 8px; font-size: 12.5px; }
.nt-kv dt { color: var(--muted); } .nt-kv dd { margin: 0; word-break: break-word; }
.nt-empty { color: var(--muted); padding: 24px; text-align: center; }

.nt-tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
table.nt-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.nt-table th, .nt-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.nt-table th { background: var(--bg2); position: sticky; top: 0; cursor: pointer; white-space: nowrap; font-weight: 600; }
.nt-table th[data-sort="asc"]::after { content: " ▲"; font-size: 9px; }
.nt-table th[data-sort="desc"]::after { content: " ▼"; font-size: 9px; }
.nt-table tr:hover td { background: var(--bg2); }
.nt-table tr.clickable { cursor: pointer; }
.nt-detail .nt-table th, .nt-detail .nt-table td { padding: 4px 6px; font-size: 12px; }
.nt-detail .nt-table td a { white-space: nowrap; }
.nt-detail .nt-table .nt-mono { font-size: 11.5px; word-break: break-all; }
.nt-filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 4px; }
.dot.up { background: var(--ok); } .dot.down { background: var(--err); }

@media (max-width: 860px) {
  .nt-diagram, .nt-diagram.nodetail { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 62vh) auto; height: auto; }
  .nt-detail { border-left: 0; border-top: 1px solid var(--border); max-height: none; }
  .nt-diagram.nodetail .nt-detail { display: none; }
  .nt-head, .nt-panel { padding-left: 16px; padding-right: 16px; }
}
@media print {
  .nt-tabs, .nt-toolbar { display: none; }
  .nt-panel[hidden] { display: block; }
}

</style>

/* TopoView - renderização da topologia com Cytoscape.js (compartilhado entre relatório HTML e UI web). */
(function () {
  "use strict";

  function cssVar(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v && v.trim()) || fallback;
  }

  function edgeWidth(e) {

  }

  function buildStyle() {
    var fg = cssVar("--fg", "#1f2328");
    var muted = cssVar("--muted", "#656d76");
    var bg = cssVar("--bg", "#ffffff");
    var line = cssVar("--edge", "#8c959f");
    var accent = cssVar("--accent", "#0969da");
    return [
      { selector: "node", style: {
          "background-color": bg, "background-opacity": 0, "background-image": "data(icon)",
          "background-fit": "contain", "background-clip": "none", "width": 44, "height": 44, "shape": "round-rectangle",
          "label": "data(label)", "text-valign": "bottom", "text-halign": "center", "text-margin-y": 6,
          "font-size": 11, "font-family": "system-ui, -apple-system, Segoe UI, Roboto, sans-serif", "color": fg,
          "text-wrap": "wrap", "text-max-width": 140, "text-background-color": bg, "text-background-opacity": 0.85,
          "text-background-padding": 2, "text-background-shape": "round-rectangle", "border-width": 0 } },
      { selector: "node.stub", style: { "opacity": 0.72, "font-style": "italic" } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": accent, "border-style": "solid",
          "background-opacity": 0 } },
      { selector: "node.match", style: { "border-width": 3, "border-color": "#bf8700", "border-style": "double" } },
      { selector: "node.faded, edge.faded", style: { "opacity": 0.15 } },
      { selector: "edge", style: {
          "width": edgeWidth, "line-color": line, "curve-style": "bezier", "control-point-step-size": 28,
          "source-label": "data(sourceLabel)", "target-label": "data(targetLabel)",
          "source-text-offset": 34, "target-text-offset": 34, "font-size": 9, "color": muted,
          "text-background-color": bg, "text-background-opacity": 0.9, "text-background-padding": 1,
          "text-rotation": "autorotate" } },
      { selector: "edge.l3", style: { "line-style": "dashed", "line-color": "#0969da" } },
      { selector: "edge.logical", style: { "line-style": "dotted", "line-color": "#bf8700" } },
      { selector: "edge:selected", style: { "line-color": accent, "width": 5 } },
      { selector: ".nolabels edge", style: { "source-label": "", "target-label": "" } },
      { selector: "edge.hidden, node.hidden", style: { "display": "none" } }
    ];
  }

  function create(container, graph, opts) {
    opts = opts || {};

      container: container,
      elements: [].concat(graph.elements.nodes, graph.elements.edges),
      layout: { name: "preset", padding: 40 },
      style: buildStyle(),
      wheelSensitivity: 0.25,
      minZoom: 0.05,
      maxZoom: 4
    });
    var presetPositions = {};
    cy.nodes().forEach(function (n) { presetPositions[n.id()] = Object.assign({}, n.position()); });

    cy.on("tap", "node", function (e) { if (opts.onSelect) opts.onSelect(e.target.id(), "node"); });
    cy.on("tap", "edge", function (e) { if (opts.onSelect) opts.onSelect(e.target.id(), "edge"); });
    cy.on("tap", function (e) { if (e.target === cy && opts.onSelect) opts.onSelect(null); });
    cy.on("mouseover", "node", function (e) {
      var n = e.target, hood = n.closedNeighborhood();
      cy.elements().not(hood).addClass("faded");
    });
    cy.on("mouseout", "node", function () { cy.elements().removeClass("faded"); });

    var api = {
      cy: cy,
      setLayout: function (name) {
        if (name === "hierarchical") {
          cy.layout({ name: "preset", positions: function (n) { return presetPositions[n.id()]; },
                      animate: true, animationDuration: 400, padding: 40 }).run();
        } else if (name === "breadthfirst") {
          var roots = cy.nodes().filter(function (n) { return ["external", "edge"].indexOf(n.data("tier")) >= 0; });
          cy.layout({ name: "breadthfirst", roots: roots.length ? roots : undefined, spacingFactor: 1.1,
                      animate: true, animationDuration: 400, padding: 40 }).run();
        } else if (name === "concentric") {
          var order = { external: 7, edge: 6, security: 5, core: 4, distribution: 3, access: 2, endpoint: 1 };
          cy.layout({ name: "concentric", concentric: function (n) { return order[n.data("tier")] || 0; },
                      levelWidth: function () { return 1; }, minNodeSpacing: 40, animate: true,
                      animationDuration: 400, padding: 40 }).run();
        } else {
          cy.layout({ name: "cose", animate: true, animationDuration: 500, nodeRepulsion: 90000,
                      idealEdgeLength: 110, padding: 40 }).run();
        }
      },
      search: function (text) {
        cy.nodes().removeClass("match");
        text = (text || "").trim().toLowerCase();
        if (!text) return 0;
        var m = cy.nodes().filter(function (n) {
          var d = n.data();
          return [d.id, d.hostname, d.ip, d.vendor, d.model, d.roleLabel].join(" ").toLowerCase().indexOf(text) >= 0;
        });
        m.addClass("match");
        if (m.length) cy.animate({ fit: { eles: m, padding: 120 } }, { duration: 350 });
        return m.length;
      },
      focus: function (id) {
        var n = cy.getElementById(id);
        if (!n || !n.length) return;
        cy.elements().unselect();
        n.select();
        cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 1.1) }, { duration: 350 });
      },
      setFilter: function (f) {
        cy.batch(function () {
          cy.edges().forEach(function (e) {
            e.toggleClass("hidden", f.kinds && f.kinds[e.data("kind")] === false);
          });
          cy.nodes().forEach(function (n) {
            n.toggleClass("hidden", f.showStubs === false && n.data("stub"));
          });
        });
        container.classList.toggle("nolabels", f.showLabels === false);
        cy.style().selector("edge").style({
          "source-label": f.showLabels === false ? "" : "data(sourceLabel)",
          "target-label": f.showLabels === false ? "" : "data(targetLabel)"
        }).update();
      },
      refreshTheme: function () { cy.style().fromJson(buildStyle()).update(); },
      fit: function () { cy.animate({ fit: { padding: 40 } }, { duration: 300 }); },
      png: function () { return cy.png({ full: true, scale: 2, bg: cssVar("--bg", "#ffffff") }); },
      destroy: function () { cy.destroy(); }
    };
    return api;
  }

  window.TopoView = { create: create };
})();

</script>

      if (name === "diagram" && view) view.cy.resize();
    }

    function devName(id) { var d = devices[id]; return d ? (d.hostname || d.mgmt_ip || d.id) : id; }
    function openDevice(id) { show("diagram"); if (view) view.focus(id); renderDetail(id, "node"); }

    /* painel de detalhe */
    var detail, diagramBox;
    function kv(pairs) {
      return '<dl class="nt-kv">' + pairs.filter(function (p) { return p[1] !== null && p[1] !== undefined && p[1] !== ""; })
        .map(function (p) { return "<dt>" + esc(p[0]) + "</dt><dd>" + (p[2] ? p[1] : esc(p[1])) + "</dd>"; }).join("") + "</dl>";
    }
    function renderDetail(id, kind) {
      if (!detail) return;
      if (!id) { detail.innerHTML = '<div class="nt-empty">Clique em um equipamento ou link para ver os detalhes.</div>'; return; }
      if (kind === "edge") {
        var l = links.filter(function (x) { return x.id === id; })[0];
        if (!l) return;
        detail.innerHTML = "<h2>Link " + esc(l.id) + "</h2>" +
          '<span class="nt-badge">' + esc(KIND_PT[l.kind] || l.kind) + "</span>" +
          kv([["Origem", devName(l.source)], ["Interface", l.source_interface], ["Destino", devName(l.target)],
              ["Interface", l.target_interface], ["Protocolos", (l.protocols || []).join(", ")], ["Sub-rede", l.subnet],
              ["Velocidade", speed(l.speed_mbps)], ["Agregação", l.lag]]);
        return;
      }
      var d = devices[id];
      if (!d) return;
      var h = "<h2>" + esc(d.hostname || d.mgmt_ip || d.id) + "</h2>";
      h += '<span class="nt-badge">' + esc(ROLE_PT[d.role] || d.role) + "</span>";
      if (d.tier) h += '<span class="nt-badge">' + esc(TIER_PT[d.tier] || d.tier) + "</span>";
      h += d.stub ? '<span class="nt-badge stub">não coletado</span>' : '<span class="nt-badge ok">coletado</span>';
      h += "<h3>Identificação</h3>" + kv([
        ["IP gerência", d.mgmt_ip], ["Fabricante", d.vendor], ["Sistema", d.os], ["Versão", d.os_version],
        ["Modelo", d.model], ["Serial", d.serial], ["Uptime", d.uptime], ["Local", d.location], ["Contato", d.contact],
        ["Chassis MAC", d.chassis_id], ["Coletado via", (d.collected_via || []).join(", ")],
        ["Descoberto por", d.discovered_from ? devName(d.discovered_from) : ""],
        ["Descrição", d.sys_description]]);
      var lk = links.filter(function (x) { return x.source === id || x.target === id; });
      if (lk.length) {
        h += "<h3>Conexões (" + lk.length + ")</h3><table class='nt-table'><tr><th>Local</th><th>Vizinho</th><th>Remota</th></tr>" +
          lk.map(function (x) {
            var me = x.source === id, other = me ? x.target : x.source;
            return "<tr title='" + esc((x.protocols || []).join(", ")) + "'><td class='nt-mono'>" + esc(shortIf(me ? x.source_interface : x.target_interface)) +
              "</td><td><a href='#' data-dev='" + esc(other) + "'>" + esc(devName(other)) + "</a></td><td class='nt-mono'>" +
              esc(shortIf(me ? x.target_interface : x.source_interface)) + "</td></tr>";
          }).join("") + "</table>";
      }
      var ifs = (d.interfaces || []).filter(function (i) { return (i.ipv4 && i.ipv4.length) || i.oper_up || i.description; });
      if (ifs.length) {
        h += "<h3>Interfaces (" + ifs.length + " de " + (d.interfaces || []).length + ")</h3><table class='nt-table'><tr><th>Nome</th><th>IP</th><th>Status</th><th>Vel.</th></tr>" +
          ifs.slice(0, 80).map(function (i) {
            return "<tr><td class='nt-mono' title='" + esc(i.description) + "'>" + esc(shortIf(i.name)) + "</td><td class='nt-mono'>" + esc((i.ipv4 || []).join(" ")) +
              "</td><td>" + status(i.oper_up) + "</td><td>" + esc(speed(i.speed_mbps)) + "</td></tr>";
          }).join("") + "</table>";
      }
      if (d.vlans && d.vlans.length) h += "<h3>VLANs</h3><div>" + d.vlans.map(function (v) { return '<span class="nt-badge">' + v.id + (v.name ? " " + esc(v.name) : "") + "</span>"; }).join("") + "</div>";
      if (d.errors && d.errors.length) h += "<h3>Avisos</h3><ul>" + d.errors.map(function (e) { return "<li class='nt-muted'>" + esc(e) + "</li>"; }).join("") + "</ul>";
      detail.innerHTML = h;
    }

    var builders = {
      diagram: function (p) {
        if (typeof cytoscape === "undefined" || !window.TopoView) {
          p.innerHTML = '<div class="nt-empty">Não foi possível carregar o Cytoscape.js (sem acesso à internet?). As abas de documentação continuam disponíveis.</div>';
          return;
        }
        diagramBox = el("div", { class: "nt-diagram" });
        var wrap = el("div", { class: "nt-canvas-wrap" });
        var canvas = el("div", { class: "nt-canvas" });
        var tb = el("div", { class: "nt-toolbar" });
        var search = el("input", { class: "nt-input", type: "search", placeholder: "Buscar host, IP, modelo…", "aria-label": "Buscar" });
        var layout = el("select", { class: "nt-select", "aria-label": "Layout" },
          '<option value="hierarchical">Hierárquico</option><option value="cose">Orgânico</option>' +
          '<option value="breadthfirst">Árvore</option><option value="concentric">Concêntrico</option>');
        var filters = { kinds: { physical: true, l3: true, logical: true }, showStubs: true, showLabels: true };
        function toggle(label, get, set) {
          var id = "t" + Math.random().toString(36).slice(2);
          var t = el("label", { class: "nt-toggle", for: id }, '<input type="checkbox" id="' + id + '"' + (get() ? " checked" : "") + "> " + esc(label));
          t.querySelector("input").addEventListener("change", function (e) { set(e.target.checked); view.setFilter(filters); });
          return t;
        }
        tb.appendChild(search); tb.appendChild(layout);
        tb.appendChild(toggle("L3", function () { return true; }, function (v) { filters.kinds.l3 = v; }));
        tb.appendChild(toggle("Roteamento", function () { return true; }, function (v) { filters.kinds.logical = v; }));
        tb.appendChild(toggle("Não coletados", function () { return true; }, function (v) { filters.showStubs = v; }));
        tb.appendChild(toggle("Portas", function () { return true; }, function (v) { filters.showLabels = v; }));
        var fit = el("button", { class: "nt-btn", type: "button" }, "Ajustar");
        var png = el("button", { class: "nt-btn", type: "button" }, "PNG");
        var det = el("button", { class: "nt-btn", type: "button", title: "Mostrar/ocultar painel" }, "Painel");
        tb.appendChild(fit); tb.appendChild(png); tb.appendChild(det);
        var legend = el("div", { class: "nt-legend" });
        var roles = {};
        devList.forEach(function (d) { roles[d.role] = true; });
        var lg = (data.graph.legend || {}).roles || {};
        legend.innerHTML = '<div class="row">' + Object.keys(lg).filter(function (r) { return roles[r]; }).map(function (r) {
          return '<span class="it"><img alt="" src="' + lg[r].icon + '">' + esc(lg[r].label) + "</span>";
        }).join("") + '</div><div class="row" style="margin-top:4px"><span class="it"><span class="ln"></span>Físico</span>' +
          '<span class="it"><span class="ln l3"></span>L3</span><span class="it"><span class="ln logical"></span>Roteamento</span>' +
          '<span class="it nt-muted">tracejado/itálico = não coletado</span></div>';
        wrap.appendChild(canvas); wrap.appendChild(tb); wrap.appendChild(legend);
        detail = el("div", { class: "nt-detail" });
        diagramBox.appendChild(wrap); diagramBox.appendChild(detail);
        p.appendChild(diagramBox);
        view = window.TopoView.create(canvas, data.graph, { onSelect: renderDetail });
        renderDetail(null);
        search.addEventListener("input", function () { view.search(search.value); });
        layout.addEventListener("change", function () { view.setLayout(layout.value); });
        fit.addEventListener("click", function () { view.fit(); });
        det.addEventListener("click", function () { diagramBox.classList.toggle("nodetail"); setTimeout(function () { view.cy.resize(); }, 50); });
        png.addEventListener("click", function () {
          var a = document.createElement("a");
          a.href = view.png(); a.download = (meta.name || "topologia").replace(/\W+/g, "_") + ".png"; a.click();
        });
        detail.addEventListener("click", function (e) {
          var a = e.target.closest("[data-dev]");
          if (a) { e.preventDefault(); openDevice(a.getAttribute("data-dev")); }
        });
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { view.refreshTheme(); });
        }
      },
      inventory: function (p) {
        dataTable(p, [
          { title: "Hostname", get: function (d) { return d.hostname || d.id; } },
          { title: "IP", key: "mgmt_ip" },
          { title: "Papel", get: function (d) { return ROLE_PT[d.role] || d.role; } },
          { title: "Camada", get: function (d) { return TIER_PT[d.tier] || d.tier || ""; } },
          { title: "Fabricante", key: "vendor" }, { title: "Sistema", key: "os" }, { title: "Versão", key: "os_version" },
          { title: "Modelo", key: "model" }, { title: "Serial", key: "serial" },
          { title: "Coleta", get: function (d) { return d.stub ? "vizinho" : (d.collected_via || []).join(", "); } },
          { title: "Interfaces", get: function (d) { return (d.interfaces || []).length; } }
        ], devList, { onRow: function (d) { openDevice(d.id); }, sort: 0 });
      },
      links: function (p) {
        dataTable(p, [
          { title: "ID", key: "id" }, { title: "Origem", get: function (l) { return devName(l.source); } },
          { title: "Interface", key: "source_interface" }, { title: "Destino", get: function (l) { return devName(l.target); } },
          { title: "Interface", key: "target_interface" }, { title: "Tipo", get: function (l) { return KIND_PT[l.kind] || l.kind; } },
          { title: "Protocolos", get: function (l) { return (l.protocols || []).join(", "); } },
          { title: "Velocidade", get: function (l) { return speed(l.speed_mbps); } }, { title: "Sub-rede", key: "subnet" },
          { title: "LAG", key: "lag" }
        ], links, { onRow: function (l) { show("diagram"); if (view) { view.focus(l.source); renderDetail(l.id, "edge"); } } });
      },
      interfaces: function (p) {
        var rows = [];
        devList.forEach(function (d) { if (!d.stub) (d.interfaces || []).forEach(function (i) { rows.push(Object.assign({ dev: d.hostname || d.id, devId: d.id }, i)); }); });
        dataTable(p, [
          { title: "Equipamento", key: "dev" }, { title: "Interface", key: "name" }, { title: "Descrição", key: "description" },
          { title: "IPv4", get: function (i) { return (i.ipv4 || []).join(" "); } },
          { title: "Admin", get: function (i) { return i.admin_up === true ? "up" : i.admin_up === false ? "down" : ""; } },
          { title: "Oper", get: function (i) { return i.oper_up === true ? "up" : i.oper_up === false ? "down" : ""; }, html: function (i) { return status(i.oper_up); } },
          { title: "Velocidade", get: function (i) { return speed(i.speed_mbps); } }, { title: "MTU", key: "mtu" },
          { title: "MAC", key: "mac" }, { title: "LAG", key: "parent" }, { title: "VLAN", key: "access_vlan" }
        ], rows, { onRow: function (i) { openDevice(i.devId); } });
      },
      vlans: function (p) {
        var map = {};
        devList.forEach(function (d) { (d.vlans || []).forEach(function (v) {
          var m = map[v.id] || (map[v.id] = { id: v.id, names: {}, devs: [] });
          if (v.name) m.names[v.name] = true; m.devs.push(d.hostname || d.id);
        }); });
        var rows = Object.keys(map).map(function (k) { var m = map[k]; return { id: m.id, name: Object.keys(m.names).join(" / "), count: m.devs.length, devs: m.devs.join(", ") }; });
        if (!rows.length) { p.innerHTML = '<div class="nt-empty">Nenhuma VLAN coletada.</div>'; return; }
        dataTable(p, [{ title: "VLAN", key: "id" }, { title: "Nome", key: "name" }, { title: "Equipamentos", key: "count" },
          { title: "Presente em", key: "devs" }], rows, { sort: 0 });
      },
      neighbors: function (p) {
        var rows = [];
        devList.forEach(function (d) { (d.neighbors || []).forEach(function (n) { rows.push(Object.assign({ dev: d.hostname || d.id, devId: d.id }, n)); }); });
        dataTable(p, [
          { title: "Equipamento", key: "dev" }, { title: "Protocolo", key: "protocol" }, { title: "Interface local", key: "local_interface" },
          { title: "Vizinho", key: "remote_hostname" }, { title: "Interface remota", key: "remote_interface" },
          { title: "IP", key: "remote_mgmt_ip" }, { title: "Plataforma", key: "remote_platform" },
          { title: "Capacidades", get: function (n) { return (n.remote_capabilities || []).join(", "); } },
          { title: "ASN", key: "remote_asn" }, { title: "Estado", key: "state" }
        ], rows, { onRow: function (n) { openDevice(n.devId); } });
      },
      routing: function (p) {
        var ips = [];
        devList.forEach(function (d) { (d.interfaces || []).forEach(function (i) { (i.ipv4 || []).forEach(function (a) {
          ips.push({ ip: a, dev: d.hostname || d.id, devId: d.id, itf: i.name, desc: i.description, vrf: i.vrf });
        }); }); });
        p.appendChild(el("h3", null, "Endereçamento IPv4"));
        dataTable(p, [{ title: "Endereço", key: "ip" }, { title: "Equipamento", key: "dev" }, { title: "Interface", key: "itf" },
          { title: "VRF", key: "vrf" }, { title: "Descrição", key: "desc" }], ips, { onRow: function (r) { openDevice(r.devId); } });
        var routes = [];
        devList.forEach(function (d) { (d.routes || []).forEach(function (r) { routes.push(Object.assign({ dev: d.hostname || d.id }, r)); }); });
        p.appendChild(el("h3", { style: "margin-top:22px" }, "Tabela de rotas"));
        dataTable(p, [{ title: "Equipamento", key: "dev" }, { title: "Prefixo", key: "prefix" }, { title: "Next-hop", key: "next_hop" },
          { title: "Interface", key: "interface" }, { title: "Protocolo", key: "protocol" }, { title: "VRF", key: "vrf" }], routes);
      },
      failures: function (p) {
        var rows = Object.keys(failed).map(function (k) { return { target: k, reason: failed[k] }; });
        dataTable(p, [{ title: "Alvo", key: "target" }, { title: "Motivo", key: "reason" }], rows);
      }
    };
    builders.diagram(panels.diagram);
    built.diagram = true;
    // Deep-link: #tab=inventory ou #device=<id>
    if (opts.deepLink !== false) {
      var tabMatch = /tab=(\w+)/.exec(location.hash), devMatch = /device=([^&]+)/.exec(location.hash);
      if (devMatch && devices[decodeURIComponent(devMatch[1])]) setTimeout(function () { openDevice(decodeURIComponent(devMatch[1])); }, 0);
      else if (tabMatch && panels[tabMatch[1]]) show(tabMatch[1]);
    }
    return { show: show, openDevice: openDevice, view: function () { return view; },
      destroy: function () { if (view) view.destroy(); root.innerHTML = ""; } };
  }

  window.NetTopoViewer = { mount: mount, esc: esc };
})();

</script>
<script>
  (function () {
    var data = JSON.parse(document.getElementById("nettopo-data").textContent);
    window.NetTopoViewer.mount(document.getElementById("nettopo-root"), data);
  })();
</script>
</body>
</html>
