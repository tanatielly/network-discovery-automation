# Laboratório simulado multi-vendor usado por `nettopo demo` e pelos testes.
# Campus de 3 camadas + datacenter + borda com dupla operadora + filial via OSPF.
name: Demo - Campus Multi-vendor
devices:
  EDGE-RTR-01:
    mgmt_ip: 10.0.0.1
    profile: cisco_ios
    model: ISR4451-X/K9
    version: 17.9.4a
    serial: FDO2231A0BC
    interfaces:
      GigabitEthernet0/0/0: 200.200.10.2/30
      GigabitEthernet0/0/1: 10.255.0.1/30
      GigabitEthernet0/0/2: 10.255.0.9/30
      GigabitEthernet0/0/3: 172.16.0.1/30
      Loopback0: 10.0.0.1/32
    bgp: [{peer: 200.200.10.1, asn: 64500}]
  EDGE-RTR-02:
    mgmt_ip: 10.0.0.2
    profile: juniper_junos
    model: MX204
    version: 22.4R3-S2
    serial: JN1234ABCDEF
    interfaces:
      xe-0/1/0: 200.201.20.2/30
      xe-0/1/1: 10.255.0.5/30
      xe-0/1/2: 10.255.0.10/30
      lo0: 10.0.0.2/32
    bgp: [{peer: 200.201.20.1, asn: 64510}]
  ISP-A-PE:
    mgmt_ip: 200.200.10.1
    profile: juniper_junos
    model: MX960
    reachable: false
    caps: [router]
  ISP-B-PE:
    mgmt_ip: 200.201.20.1
