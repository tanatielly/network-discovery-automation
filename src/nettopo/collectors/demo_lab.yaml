  CORE-SW-02:
    mgmt_ip: 10.0.0.11
    profile: cisco_nxos
    model: N9K-C93180YC-FX
    version: 10.3(4a)
    serial: FDO23450XYZ
    interfaces:
      Ethernet1/1: 10.10.0.4/29
      Vlan10: 10.1.10.3/24
    lags: {Ethernet1/49: port-channel100, Ethernet1/50: port-channel100}
  DIST-SW-01:
