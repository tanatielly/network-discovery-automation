    version: WC.16.11.0012
    serial: CN12ABC001
  ACC-SW-02:
    mgmt_ip: 10.0.2.2
    profile: dell_os10
    model: S4128F-ON
    version: 10.5.5.3
    serial: CN0DELL0001
  ACC-SW-03:
    mgmt_ip: 10.0.2.3
    profile: extreme_exos
    model: X440-G2-48p-10G4
    version: 31.7.1.4
