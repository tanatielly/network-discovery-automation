    version: 5.15.0-105-generic
    serial: VMware-42-1a-7b
    caps: [station]
    interfaces:
      eno1: 10.0.3.10/24

# [lado A, lado B, protocolos, velocidade Mbps]
links:
  - [EDGE-RTR-01:GigabitEthernet0/0/0, ISP-A-PE:xe-0/0/1, [lldp], 1000]
  - [EDGE-RTR-02:xe-0/1/0, ISP-B-PE:1/1/1, [lldp], 10000]
  - [EDGE-RTR-01:GigabitEthernet0/0/1, FW-01:port1, [lldp], 1000]
  - [EDGE-RTR-02:xe-0/1/1, FW-02:ethernet1/1, [lldp], 10000]
  - [EDGE-RTR-01:GigabitEthernet0/0/2, EDGE-RTR-02:xe-0/1/2, [lldp], 1000]
  - [FW-01:port2, CORE-SW-01:Ethernet1, [lldp], 10000]
  - [FW-02:ethernet1/2, CORE-SW-02:Ethernet1/1, [lldp], 10000]
  - [FW-01:ha1, FW-02:ha1-a, [lldp], 1000]
  - [CORE-SW-01:Ethernet49/1, CORE-SW-02:Ethernet1/49, [lldp], 100000]
  - [CORE-SW-01:Ethernet50/1, CORE-SW-02:Ethernet1/50, [lldp], 100000]
  - [CORE-SW-01:Ethernet2, DIST-SW-01:XGigabitEthernet0/0/1, [lldp], 10000]
  - [CORE-SW-02:Ethernet1/2, DIST-SW-01:XGigabitEthernet0/0/2, [lldp], 10000]
  - [CORE-SW-01:Ethernet3, DIST-SW-02:1/1/1, [lldp], 25000]
  - [CORE-SW-02:Ethernet1/3, DIST-SW-02:1/1/2, [lldp, cdp], 25000]
  - [DIST-SW-01:GigabitEthernet0/0/10, ACC-SW-01:49, [lldp], 10000]
  - [DIST-SW-01:GigabitEthernet0/0/11, ACC-SW-02:ethernet1/1/25, [lldp], 10000]
  - [DIST-SW-01:GigabitEthernet0/0/12, ACC-SW-05:ten-gigabit-ethernet-1/1/1, [lldp], 10000]
  - [DIST-SW-02:1/1/10, ACC-SW-03:49, [lldp], 10000]
  - [DIST-SW-02:1/1/11, ACC-SW-04:sfp-sfpplus1, [lldp, mndp], 10000]
  - [ACC-SW-01:1, AP-01:eth0, [lldp], 1000]
  - [ACC-SW-03:5, AP-02:eth0, [lldp], 1000]
  - [ACC-SW-02:ethernet1/1/1, SEP001122334455:Port 1, [lldp], 1000]
  - [ACC-SW-04:ether2, SRV-01:eno1, [lldp], 1000]
  - [BRANCH-RTR-01:ether2, BRANCH-SW-01:gi1/0/24, [lldp, mndp], 1000]

# Adjacências de roteamento (não geram LLDP)
routing:
  - {a: EDGE-RTR-01, a_if: GigabitEthernet0/0/3, a_ip: 172.16.0.1, b: BRANCH-RTR-01, b_if: sfp-sfpplus1, b_ip: 172.16.0.2, protocol: ospf}
  - {a: EDGE-RTR-01, a_if: GigabitEthernet0/0/2, a_ip: 10.255.0.9, b: EDGE-RTR-02, b_if: xe-0/1/2, b_ip: 10.255.0.10, protocol: ospf}
