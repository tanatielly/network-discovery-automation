    model: 7750 SR-12
    reachable: false
    caps: [router]
  FW-01:
    mgmt_ip: 10.0.0.3
    profile: fortinet_fortios
    model: FortiGate-600E
    version: v7.2.8
    serial: FG6H0E5819900001
    interfaces:
      port1: 10.255.0.2/30
      port2: 10.10.0.1/29
  FW-02:
    mgmt_ip: 10.0.0.4
    profile: paloalto_panos
    model: PA-3220
    version: 10.2.9-h1
    serial: "016201001234"
    interfaces:
      ethernet1/1: 10.255.0.6/30
      ethernet1/2: 10.10.0.2/29
  CORE-SW-01:
    mgmt_ip: 10.0.0.10
