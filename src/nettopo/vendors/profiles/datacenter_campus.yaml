    sys_object_id: ["1.3.6.1.4.1.2272."]
    sys_descr: ["VSP-\\d+", "VOSS", "Virtual Services Platform"]
    commands:
      facts: show sys-info
      lldp: show lldp neighbor
      arp: show ip arp
      routes: show ip route
      vlans: show vlan basic

  - id: ruckus_fastiron
    vendor: Ruckus / Brocade
    os: FastIron (ICX)
    category: switch
    priority: 20
    netmiko: ruckus_fastiron
    sys_object_id: ["1.3.6.1.4.1.1991."]
    sys_descr: ["ICX\\d+", "FastIron", "Brocade", "Ruckus"]
    commands:
      facts: show version
      interfaces: show interfaces brief
      ip_interfaces: show ip interface
      lldp: show lldp neighbors detail
      other_l2: show fdp neighbors detail
      arp: show arp
      routes: show ip route
      vlans: show vlan

  - id: allied_telesis_awplus
    vendor: Allied Telesis
    os: AlliedWare Plus
    category: switch
    priority: 20
