  - id: nokia_sros
    vendor: Nokia
    os: SR OS
    category: router
    priority: 20
    netmiko: nokia_sros
    sys_object_id: ["1.3.6.1.4.1.6527."]
    sys_descr: ["TiMOS", "Nokia 7[0-9]{3}", "Alcatel-Lucent", "Nokia SR OS", "7750 SR"]
    version_regex: 'TiMOS-[A-Z]-([\w.]+)'
    netconf: default
