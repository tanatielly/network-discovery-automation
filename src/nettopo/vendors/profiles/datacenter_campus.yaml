profiles:
  - id: dell_os10
    vendor: Dell
    os: OS10
    category: switch
    priority: 20
    netmiko: dell_os10
    sys_object_id: ["1.3.6.1.4.1.674.11000."]
    sys_descr: ["Dell EMC Networking OS10", "OS10"]
    commands:
      facts: show version
      interfaces: show interface
      ip_interfaces: show ip interface brief
      lldp: show lldp neighbors detail
      arp: show ip arp
      routes: show ip route
      vlans: show vlan
      mac_table: show mac address-table

  - id: dell_os6
    vendor: Dell
    os: OS6 / PowerConnect
    category: switch
    priority: 15
    netmiko: dell_os6
    textfsm: dell_force10
    sys_object_id: ["1.3.6.1.4.1.674.10895."]
    sys_descr: ["Dell EMC Networking N", "PowerConnect", "Dell Networking N"]
    commands:
      facts: show version
      lldp: show lldp remote-device detail all
      arp: show arp
      routes: show ip route
      vlans: show vlan

  - id: extreme_exos
    vendor: Extreme Networks
    os: EXOS
    category: switch
    priority: 20
    netmiko: extreme_exos
    sys_object_id: ["1.3.6.1.4.1.1916."]
    sys_descr: ["ExtremeXOS", "EXOS"]
    commands:
      facts: show version
      hostname: show switch
      ip_interfaces: show ipconfig
      lldp: show lldp neighbors detailed
      other_l2: show edp ports all
      arp: show iparp
      routes: show iproute
      vlans: show vlan
      mac_table: show fdb
    parsers:
      hostname: kv_colon

  - id: extreme_vsp
    vendor: Extreme Networks
    os: VOSS / VSP
    category: switch
    priority: 20
