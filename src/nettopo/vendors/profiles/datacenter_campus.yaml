  - id: tplink_jetstream
    vendor: TP-Link
    os: JetStream
    category: switch
    priority: 20
    netmiko: tplink_jetstream
    sys_object_id: ["1.3.6.1.4.1.11863."]
    sys_descr: ["JetStream", "TP-LINK", "T\\d{4}G"]
