profiles:
  - id: huawei_vrp
    vendor: Huawei
    os: VRP
    category: network
    priority: 20
    netmiko: huawei
    sys_object_id: ["1.3.6.1.4.1.2011."]
    sys_descr: ["Huawei Versatile Routing Platform", "VRP \\(R\\) software", "HUAWEI"]
    version_regex: 'Version\s+([\d.]+\s*\([\w\s]+\))'
    netconf: huawei
    commands:
      facts: display version
      hostname: display current-configuration | include sysname
      interfaces: display interface
      ip_interfaces: display ip interface brief
      lldp: display lldp neighbor
      arp: display arp all
      routes: display ip routing-table
      vlans: display vlan
      mac_table: display mac-address
      ospf: display ospf peer brief
      bgp: display bgp peer

  - id: zte_zxros
    vendor: ZTE
    os: ZXROS
    category: network
    priority: 20
    netmiko: zte_zxros
    sys_object_id: ["1.3.6.1.4.1.3902."]
    sys_descr: ["ZTE", "ZXR10", "ZXROS"]
    commands:
      facts: show version
      ip_interfaces: show ip interface brief
      lldp: show lldp neighbor
      arp: show arp
      routes: show ip forwarding route
      vlans: show vlan
