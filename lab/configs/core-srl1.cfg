set / system name host-name core-srl1
set / system lldp admin-state enable
set / system lldp management-address mgmt0.0 type [ IPv4 ]
set / system management openconfig admin-state enable
set / system information location "Core - Rack C1"
set / network-instance default type default
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to edge-mk1 ether4"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.10.1.2/30
set / network-instance default interface ethernet-1/1.0
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "to core-srl2 e1-2"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.10.0.0/31
set / network-instance default interface ethernet-1/2.0
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description "to dist-frr1 eth1"
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.10.3.1/30
set / network-instance default interface ethernet-1/3.0
